# Perfil local: solo para depurar en el host. Muestra el SQL y sube el nivel de log de la aplicación.
# La seguridad es la misma que en los demás perfiles (ver SecurityConfig): solo Swagger/OpenAPI y
# /actuator/health son públicos y el resto exige un JWT de Keycloak.
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.rovedasa: DEBUG
    org.springframework.security: INFO
