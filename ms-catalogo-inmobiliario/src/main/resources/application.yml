server:
  port: 8081

spring:
  application:
    name: ms-catalogo-inmobiliario

  datasource:
    url: jdbc:postgresql://localhost:5432/catalogo_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    web:
      pageable:
        max-page-size: 100

  security:
    oauth2:
      resourceserver:
        jwt:
          # Solo jwk-set-uri para aceptar tokens emitidos via localhost, 127.0.0.1 o keycloak:8080 en Docker
          jwk-set-uri: http://localhost:8083/realms/rovedasa-realm/protocol/openid-connect/certs

# Integracion externa GeoRef AR
georef:
  api:
    base-url: https://apis.datos.gob.ar/georef/api
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

# Integracion externa BCRA - Central de Deudores (evaluacion de solvencia del garante, F-08)
bcra:
  api:
    base-url: https://api.bcra.gob.ar
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  solvencia:
    # RN-07: solvente con situacion crediticia 1 o 2 (y 0 cheques rechazados)
    situacion-maxima: 2

logging:
  level:
    com.rovedasa.catalogo: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: when_authorized
