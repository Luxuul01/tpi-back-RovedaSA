server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8083/realms/rovedasa-realm/protocol/openid-connect/certs


# Variables personalizadas para inyectar con @Value en GWConfig
rovedasa-gw:
  url-microservicio-catalogo: http://localhost:8081
  url-microservicio-contratos: http://localhost:8082

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: ms-catalogo-inmobiliario
        url: /v3/api-docs/catalogo
      - name: ms-contratos
        url: /v3/api-docs/contratos

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: when_authorized