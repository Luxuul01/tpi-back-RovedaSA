server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8083/realms/rovedasa-realm/protocol/openid-connect/certs


# Variables personalizadas para inyectar con @Value en GWConfig
rovedasa-gw:
  url-microservicio-catalogo: http://localhost:8081
  url-microservicio-contratos: http://localhost:8082

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: DEBUG