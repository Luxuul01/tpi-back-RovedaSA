services:
  db-catalogo:
    image: postgres:16-alpine
    container_name: tpi-db-catalogo
    restart: unless-stopped
    environment:
      POSTGRES_DB: catalogo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata_catalogo:/var/lib/postgresql/data
    networks:
      - tpi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalogo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-contratos:
    image: postgres:16-alpine
    container_name: tpi-db-contratos
    restart: unless-stopped
    environment:
      POSTGRES_DB: contratos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata_contratos:/var/lib/postgresql/data
    networks:
      - tpi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contratos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: tpi-keycloak
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    command: start-dev --import-realm
    ports:
      - "8083:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - tpi-network
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && IFS= read -r line <&3 && [[ \"$$line\" == *200* ]]"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ==========================================
  # Microservicios y API Gateway (Spring Boot)
  # ==========================================
  ms-catalogo-inmobiliario:
    build:
      context: .
      dockerfile: ms-catalogo-inmobiliario/Dockerfile
    container_name: tpi-ms-catalogo
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    volumes:
      - ./logs/catalogo:/app/logs
    networks:
      - tpi-network
    depends_on:
      db-catalogo:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  ms-contratos:
    build:
      context: .
      dockerfile: ms-contratos/Dockerfile
    container_name: tpi-ms-contratos
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8082:8082"
    volumes:
      - ./logs/contratos:/app/logs
    networks:
      - tpi-network
    depends_on:
      db-contratos:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ms-catalogo-inmobiliario:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: tpi-api-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    volumes:
      - ./logs/gateway:/app/logs
    networks:
      - tpi-network
    depends_on:
      keycloak:
        condition: service_healthy
      ms-catalogo-inmobiliario:
        condition: service_healthy
      ms-contratos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ==========================================
  # Observabilidad y Centralización de Logs (PLG Stack)
  # ==========================================
  loki:
    image: grafana/loki:2.9.4
    container_name: tpi-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - tpi-network

  promtail:
    image: grafana/promtail:2.9.4
    container_name: tpi-promtail
    restart: unless-stopped
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - tpi-network
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.4.2
    container_name: tpi-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - tpi-network
    depends_on:
      - loki

volumes:
  pgdata_catalogo:
  pgdata_contratos:
  loki_data:
  grafana_data:

networks:
  tpi-network:
    driver: bridge
