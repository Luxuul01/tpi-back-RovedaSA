services:
  db-catalogo:
    image: postgres:16-alpine
    container_name: tpi-db-catalogo
    restart: unless-stopped
    environment:
      POSTGRES_DB: catalogo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata_catalogo:/var/lib/postgresql/data
    networks:
      - tpi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalogo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-contratos:
    image: postgres:16-alpine
    container_name: tpi-db-contratos
    restart: unless-stopped
    environment:
      POSTGRES_DB: contratos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata_contratos:/var/lib/postgresql/data
    networks:
      - tpi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contratos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: tpi-keycloak
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    ports:
      - "8083:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - tpi-network

  # ==========================================
  # Observabilidad y Centralización de Logs (PLG Stack)
  # ==========================================
  loki:
    image: grafana/loki:2.9.4
    container_name: tpi-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - tpi-network

  promtail:
    image: grafana/promtail:2.9.4
    container_name: tpi-promtail
    restart: unless-stopped
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - tpi-network
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.4.2
    container_name: tpi-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - tpi-network
    depends_on:
      - loki

volumes:
  pgdata_catalogo:
  pgdata_contratos:
  loki_data:
  grafana_data:

networks:
  tpi-network:
    driver: bridge
