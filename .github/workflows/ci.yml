name: Java CI with Maven

on:
  push:
    branches: [ "main", "develop" ]
  # Todos los pull requests, sin importar la rama de destino
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # Mismo Maven que en desarrollo y en los Dockerfiles (wrapper, versión fija en .mvn/wrapper)
    - name: Build and Test with Maven Wrapper
      run: |
        chmod +x mvnw
        ./mvnw -B clean verify --file pom.xml

    # El compose tiene que seguir siendo válido sin configurar nada (sin .env)
    - name: Validate docker compose
      run: docker compose config -q
